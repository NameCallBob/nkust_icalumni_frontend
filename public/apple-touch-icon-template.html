<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100vw; height:100vh; }
  body{
    background:radial-gradient(120% 120% at 50% 20%, #234887 0%, #122c63 52%, #0a1d44 100%);
    font-family:'Songti TC','Songti SC','STSong',serif;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .badge{ position:relative; width:78vmin; height:78vmin; border-radius:50%;
    border:0.6vmin solid #d4af37;
    box-shadow:inset 0 0 0 1.6vmin rgba(212,175,55,.16);
    display:flex; align-items:center; justify-content:center; }
  .mono{ font-size:46vmin; font-weight:600; line-height:1;
    background:linear-gradient(180deg,#fbe9a8,#e6c75d 45%,#c79a32);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0.6vmin 1.4vmin rgba(0,0,0,.35));
    margin-top:1vmin; }
</style></head>
<body>
  <div class="badge"><span class="mono">智</span></div>
</body></html>
