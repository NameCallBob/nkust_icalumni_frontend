<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            margin: 0;
            width: 180px;
            height: 180px;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            border-radius: 36px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
        }
        .title1 {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .title2 {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .title3 {
            font-size: 14px;
            color: #e5e7eb;
        }
    </style>
</head>
<body>
    <div class="title1">高科大</div>
    <div class="title2">智慧商務</div>
    <div class="title3">系友會</div>
</body>
</html>
