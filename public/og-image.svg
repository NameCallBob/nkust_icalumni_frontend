    <path d="M-23 -8 A23 23 0 0 1 23 -8" stroke-width="3"/>
    <path d="M-42 2 C -24 -5, -7 -4, 0 4 C 7 -4, 24 -5, 42 2 L 42 35 C 24 28, 7 27, 0 35 C -7 27, -24 28, -42 35 Z"
