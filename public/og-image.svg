      <stop offset="0%" stop-color="#20407e"/>
      <stop offset="48%" stop-color="#112a60"/>
      <stop offset="100%" stop-color="#081a3d"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
