  <!-- frame -->
  <rect x="34" y="34" width="1132" height="562" fill="none" stroke="#d4af37" stroke-opacity="0.32"/>
  <path d="M34 80 V34 H80 M1120 34 H1166 V80 M1166 550 V596 H1120 M80 596 H34 V550"
