name: CI

# 純檢查用 CI：只做 lint / build / unit test，不會部署任何東西。
# 部署仍由人工執行。

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    name: Lint, Build & Unit Test
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint (warnings fail the build)
        run: npx eslint src --ext .js,.jsx --max-warnings=0

      - name: Production build (catches syntax / compile errors)
        run: npm run build

      - name: Unit tests
        run: npx craco test --watchAll=false --passWithNoTests

  # 手動觸發的 E2E（打正式站 aaic.nkust.edu.tw），平常 PR/push 不會自動執行。
  # 需要時在 GitHub Actions 頁面手動點擊 "Run workflow"。
  e2e-manual:
    name: E2E (manual, hits production)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/reports/html
          retention-days: 14
