name: CI

# 純檢查用 CI：lint / build / 單元測試 / 覆蓋率 / 相依弱點掃描。
# 不會部署任何東西——部署仍由人工執行。
#
# 單元測試完全離線（jsdom + mock），不會打到任何真實服務。
# 會打正式站的 E2E 是獨立的手動 job，見底部。

# CI 已停用自動觸發（2026-10），僅保留手動執行；GitHub Actions 亦已在 repo 設定關閉。
on:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: '一併執行 E2E（會打正式站 aaic.nkust.edu.tw）'
        type: boolean
        default: false

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    name: Lint, Build & Unit Test
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 警告數採「棘輪」策略：package.json 的 lint script 釘住目前的 67 個
      # 既有警告，**新增**的警告會讓 CI 失敗。清掉幾個就把 --max-warnings
      # 調低幾個——這個數字只能往下走。
      # 想看完整清單：npm run lint:strict
      - name: ESLint (no new warnings)
        run: npm run lint

      # Vite 建置；postbuild 會跑 SEO 預渲染（puppeteer 需要 Chrome，CI 環境若沒有請見 README）。
      - name: Production build (catches syntax / compile errors)
        run: npm run build

      # 覆蓋率門檻定義在 vite.config.mjs 的 test.coverage.thresholds，
      # 只針對已補上測試的核心模組（工具函數、hook）設限，
      # 不對整個 src 設全域門檻——那只會逼人寫沒有價值的假測試。
      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    # 結果不阻擋合併（既有相依的告警需另行排程處理），但會出現在 job summary。
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Audit production dependencies
        run: |
          echo '## npm audit（正式相依）' >> "$GITHUB_STEP_SUMMARY"
          npm audit --omit=dev --audit-level=high 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true

  # ── 會打正式站的 E2E ──
  # 平常的 PR/push 不會執行；需要時在 Actions 頁面手動觸發並勾選 run_e2e。
  e2e:
    name: E2E (manual, hits production)
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run Playwright tests
        env:
          # 測試帳號由 repository secrets 提供，不得寫死在檔案裡。
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/reports/html
          retention-days: 14

  # ── 品質檢查（a11y / SEO / 前端資安）──
  # 不需要登入態，跑得快，因此除了手動觸發外也每週自動跑一次，
  # 用來偵測「程式碼沒動、但正式站設定被改壞」的情況。
  quality-scan:
    name: A11y / SEO / Client Security (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run quality scans
        run: npm run test:quality -- --project=no-auth

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-scan-report
          path: e2e/reports/html
          retention-days: 30
